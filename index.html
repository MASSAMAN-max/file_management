<!DOCTYPE html>
<html>
<head>
<!-- favicon未指定だとブラウザが自動的に /favicon.ico を要求し404が発生するため、空アイコンで抑制する -->
<link rel="icon" href="data:,">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 環境依存パラメータ（config.js）はメイン処理より前に読み込む -->
<script src="config.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 画面が真っ白になる代わりに、JSエラーが起きた場合はここに表示する（デバッグ用） -->
<div id="fatalErrorBanner" style="display:none; position:fixed; top:0; left:0; right:0; background:#dc2626; color:white; padding:16px; font-size:14px; z-index:99999; white-space:pre-wrap;"></div>

<!-- ログイン画面 -->
<div id="loginScreen" class="login-container" style="display:none;">
  <div class="login-box">
    <h2 style="text-align:center; margin-bottom:32px;">ファイル保存アプリ ログイン</h2>
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div style="margin-bottom:20px;">
        <label style="display:block; margin-bottom:8px; font-weight:bold;">ログインID</label>
        <input type="text" id="loginIdInput" style="width:100%;" placeholder="IDを入力してください" autocomplete="username" required>
      </div>
      <div style="margin-bottom:32px;">
        <label style="display:block; margin-bottom:8px; font-weight:bold;">パスワード</label>
        <input type="password" id="loginPasswordInput" style="width:100%; box-sizing: border-box;" placeholder="パスワードを入力してください" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%; padding:14px; font-size:18px;">ログイン</button>
    </form>
  </div>
</div>

<!-- 初期ローディング画面 -->
<div id="initLoader">
  <div style="width: 100%; max-width: 350px; text-align: center;">
    <p id="loaderText" style="margin: 0; color: #475569; font-size: 16px; font-weight: bold; animation: pulseText 2s ease-in-out infinite;">読み込み中...</p>
  </div>
</div>

<!-- メインアプリ画面 -->
<div id="mainApp" style="display:none; padding: 12px;">
  <div style="display: flex; align-items: center; gap:8px; margin: 12px 12px 8px 12px; flex-wrap:wrap;">
    <button type="button" class="mini-logout-btn" onclick="openTagModal()">
      <span class="material-symbols-outlined">sell</span><span>マスタ管理</span>
    </button>
    <button type="button" class="mini-logout-btn" onclick="openTrashModal()">
      <span class="material-symbols-outlined">delete</span><span>ゴミ箱</span>
    </button>
    <button type="button" id="deletedFilesBtn" class="mini-logout-btn" style="display:none;" onclick="openDeletedFilesModal()">
      <span class="material-symbols-outlined">restore_from_trash</span><span>削除済み管理（管理者）</span>
    </button>
    <div style="margin-left:auto; display:flex; align-items:center; gap:6px;">
      <button type="button" id="userDisplayLabel" class="user-pill user-pill-action" onclick="handleLogout()" title="クリックでログアウト"></button>
    </div>
  </div>

  <!-- 検索・フィルターセクション -->
  <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 24px;">
    <div style="font-size: 22px; font-weight: bold; color: #1e293b; margin-bottom: 16px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
      <span style="display:flex; align-items:center; gap:8px;">
        <span class="material-symbols-outlined" style="color:var(--primary); font-size:34px;">folder_open</span> ファイル保存アプリ
      </span>
      <button class="btn btn-primary" onclick="openCreateModal()">
        <span class="material-symbols-outlined">add_circle</span> 新規登録
      </button>
    </div>

    <!-- 初期表示はキーワード検索のみ。他の項目は「絞り込み検索」を押すと展開する -->
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
      <div style="flex: 2; min-width: 240px;">
        <label class="filter-label">キーワード検索</label>
        <input type="text" id="searchValue" placeholder="文字を入力（Enterキーでも検索できます）" style="width:100%;">
      </div>
      <div style="display:flex; gap:6px;">
        <button id="searchBtn" class="btn btn-primary" onclick="search()" style="padding:10px 16px; font-size:14px;">
          <span class="material-symbols-outlined" style="font-size:18px;">search</span> 検索
        </button>
        <button id="clearBtn" class="btn btn-secondary" onclick="clearSearchFilters()" style="padding:10px 16px; font-size:14px;">
          <span class="material-symbols-outlined" style="font-size:18px;">clear</span> クリア
        </button>
        <button type="button" class="btn" style="background:#f1f5f9; color:#334155; padding:10px 16px; font-size:14px;" onclick="toggleAdvancedFilters()">
          <span class="material-symbols-outlined" style="font-size:18px;">tune</span> 詳細検索
          <span id="advancedFilterToggleIcon" class="material-symbols-outlined" style="font-size:18px; transition:transform 0.2s;">expand_more</span>
        </button>
      </div>
    </div>

    <!-- 絞り込み検索パネル（初期状態は非表示） -->
    <div id="advancedFilterPanel" style="display:none; margin-top:16px; padding-top:16px; border-top:1px dashed #e2e8f0;">
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
        <div style="flex: 1; min-width: 140px;">
          <label class="filter-label">案件No</label>
          <input type="text" id="filterCaseNo" placeholder="例：123" style="width:100%;">
        </div>
        <div style="flex: 1; min-width: 160px;">
          <label class="filter-label">書類種別</label>
          <select id="filterUseType" style="width:100%; background-color:#fafafa;"><option value="">すべて</option></select>
        </div>
        <div style="flex: 1; min-width: 140px;">
          <label class="filter-label">タグ</label>
          <select id="filterTag" style="width:100%; background-color:#fafafa;"><option value="">すべて</option></select>
        </div>
        <div style="flex: 1; min-width: 140px;">
          <label class="filter-label">発行／受領</label>
          <select id="filterIssuedOrReceived" style="width:100%; background-color:#fafafa;">
            <option value="">すべて</option>
            <option value="発行">発行</option>
            <option value="受領">受領</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 160px;">
          <label class="filter-label">取引先</label>
          <input type="text" id="filterClient" placeholder="部分一致" style="width:100%;">
        </div>
        <div style="flex: 1; min-width: 160px;">
          <label class="filter-label">作成者</label>
          <input type="text" id="filterUploader" placeholder="部分一致" style="width:100%;">
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-top: 14px;">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; flex: 2; min-width: 280px;">
          <div style="flex: 1; min-width: 130px;">
            <label class="filter-label filter-label-sm">取引日（開始）※デフォルト全期間</label>
            <input type="date" id="filterTransactionStartDate" style="width:100%; cursor:pointer;" onclick="this.showPicker?.()">
          </div>
          <div style="flex: 1; min-width: 130px;">
            <label class="filter-label filter-label-sm">取引日（終了）</label>
            <input type="date" id="filterTransactionEndDate" style="width:100%; cursor:pointer;" onclick="this.showPicker?.()">
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; flex: 2; min-width: 280px;">
          <div style="flex: 1; min-width: 130px;">
            <label class="filter-label filter-label-sm">作成日（開始）※デフォルト全期間</label>
            <input type="date" id="filterCreatedStartDate" style="width:100%; cursor:pointer;" onclick="this.showPicker?.()">
          </div>
          <div style="flex: 1; min-width: 130px;">
            <label class="filter-label filter-label-sm">作成日（終了）</label>
            <input type="date" id="filterCreatedEndDate" style="width:100%; cursor:pointer;" onclick="this.showPicker?.()">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin: 0 12px 12px 12px; flex-wrap:nowrap;">
    <div id="searchCount" style="font-weight: bold; font-size: 15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    <div class="dropdown-wrapper" id="bulkActionDropdownWrapper" style="flex-shrink:0;">
      <button class="btn" style="background:#f1f5f9; color:#334155; padding:8px 12px; font-size:13px;" onclick="toggleBulkActionMenu()">
        <span class="material-symbols-outlined" style="font-size:18px;">checklist</span> 一括操作
        <span class="material-symbols-outlined" style="font-size:16px;">expand_more</span>
      </button>
      <div id="bulkActionMenu" class="dropdown-menu" style="display:none; right:0; left:auto;">
        <div class="dropdown-item" onclick="handleZipDownload()">
          <span class="material-symbols-outlined">download</span> ZIPダウンロード
        </div>
        <div class="dropdown-item" style="color:#dc2626;" onclick="handleBulkMoveToTrash()">
          <span class="material-symbols-outlined">delete</span> ゴミ箱へ移動
        </div>
      </div>
    </div>
  </div>

  <!-- 一覧表示（ヘッダー行付き・横スクロール対応）。ヘッダーと行の列幅は同じgrid-template-columnsで揃える -->
  <div class="file-list-wrapper" style="margin: 0 12px;">
    <div class="file-list-grid file-list-header">
      <div></div>
      <div>ID</div>
      <div>状態</div>
      <div class="file-list-header-left">ファイル名</div>
      <div>書類種別</div>
      <div>タグ</div>
      <div>発行/受領</div>
      <div>取引先</div>
      <div>取引日</div>
      <div>税込金額</div>
      <div>作成者</div>
    </div>
    <div id="results"></div>
  </div>
</div>

<!-- 新規アップロードモーダル（S03） -->
<div id="createModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="padding:0;">
    <div class="modal-header">
      <button type="button" class="modal-close-btn" onclick="closeCreateModal()" aria-label="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 class="modal-title" style="--modal-accent: var(--success);">
        新規ファイル登録
      </h2>
    </div>
    <div class="modal-body">
<form id="createForm" onsubmit="handleCreateSubmit(event)">
      <div class="form-group">
        <label>ファイル</label>
        <input type="file" id="uploadFileInput" required>
      </div>
      <div class="form-group">
        <label style="display:flex; align-items:center; justify-content:space-between; font-weight:normal;">
          <span>OCRでテキストを自動抽出する</span>
          <span class="toggle-switch">
            <input type="checkbox" id="uploadUseOcr" checked onchange="applyUploadOcrLockState()">
            <span class="toggle-slider"></span>
          </span>
        </label>
        <div style="font-size:12px; color:var(--text-sub); margin-top:2px;">
          オンの場合、書類の内容に関する詳細項目はOCR結果で自動入力されるため折りたたんでおきます。オフにすると開いて手入力できます。
        </div>
      </div>

      <!-- OCRのオン/オフに関わらず常に表示・操作できる項目（発行／受領は必須のためユーザーが必ず選ぶ） -->
      <div class="form-group">
        <label>書類種別</label>
        <select id="uploadUseTypeId"><option value="">未設定（ファイル名から自動判定）</option></select>
      </div>
      <div class="form-group">
        <label>タグ</label>
        <div id="uploadTagCheckboxes" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      </div>
      <div class="form-group">
        <label>発行／受領 <span class="badge-required">必須</span></label>
        <select id="uploadIssuedOrReceived" required>
          <option value="">選択してください</option>
          <option value="発行">発行</option>
          <option value="受領">受領</option>
        </select>
      </div>
      <!-- 案件Noの紐付けはOCRで自動入力される項目ではないため、OCRのオン/オフに関わらず常に入力できる -->
      <div class="form-group">
        <label>紐付け先（案件・任意・複数可）</label>
        <div id="uploadProjectPicker"></div>
      </div>

      <!-- OCRオン時は折りたたみ、OCRオフ時は開いて手入力できる詳細項目 -->
      <div id="uploadDetailSection" style="border:1px solid #e2e8f0; border-radius:8px; margin-bottom:16px; overflow:hidden;">
        <div id="uploadDetailToggle" onclick="toggleUploadDetailSection()"
             style="cursor:pointer; background:#f8fafc; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:bold; color:#475569;">
          <span>詳細項目（表示名・取引先・金額など）</span>
          <span id="uploadDetailToggleIcon" class="material-symbols-outlined" style="transition:transform 0.2s;">expand_more</span>
        </div>
        <div id="uploadDetailBody" style="display:none; padding:16px; border-top:1px solid #e2e8f0;">
          <div class="form-group">
            <label>表示名（空欄の場合はファイル名を使用）</label>
            <input type="text" id="uploadDisplayName" placeholder="例：〇〇様邸_見積書">
          </div>
          <div style="display:flex; gap:12px;">
            <div class="form-group" style="flex:1;">
              <label>取引先</label>
              <input type="text" id="uploadClient" placeholder="例：〇〇株式会社">
            </div>
          </div>
          <div class="form-group">
            <label>適格事業者登録番号</label>
            <input type="text" id="uploadInvoiceRegistrationNumber" placeholder="例：T1234567890123（Tから始まる13桁）">
          </div>
          <div style="display:flex; gap:12px;">
            <div class="form-group" style="flex:1;">
              <label>税率</label>
              <select id="uploadTaxRate"></select>
            </div>
            <div class="form-group" style="flex:1;">
              <label>金額（税抜）</label>
              <input type="number" id="uploadAmountExcl" min="0" step="1" placeholder="例：50000">
            </div>
            <div class="form-group" style="flex:1;">
              <label>金額（税込）</label>
              <input type="number" id="uploadAmountIncl" min="0" step="1" placeholder="例：55000">
            </div>
          </div>
          <div class="form-group">
            <label>取引日</label>
            <input type="date" id="uploadTransactionDate">
          </div>
          <div class="form-group">
            <label>説明・備考</label>
            <textarea id="uploadDescription" rows="2"></textarea>
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:24px;">
        <button type="submit" id="createSubmitBtn" class="btn btn-success">登録する</button>
      </div>
    </form>
    </div>
  </div>
</div>

<!-- 詳細確認・確定保存／編集モーダル（S04・S05・S06を統合した簡易版） -->
<div id="detailModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width:640px; padding:0;">
    <div class="modal-header">
      <button type="button" class="modal-close-btn" onclick="closeDetailModal()" aria-label="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 id="detailModalTitle" class="modal-title"></h2>
    </div>
    <div class="modal-body">

    <!-- Driveプレビュー（画像・PDF・Office文書すべてDriveの標準プレビューで表示できるため形式分岐は不要） -->
    <div id="detailPreviewArea" style="margin-bottom:16px;"></div>

    <div id="detailOcrPreview" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:12px; margin-bottom:16px; font-size:13px; color:#475569; max-height:140px; overflow-y:auto; white-space:pre-wrap;"></div>

    <form id="detailForm" onsubmit="handleDetailSubmit(event)">
      <input type="hidden" id="detailFileId">
      <input type="hidden" id="detailRowNumber">
      <input type="hidden" id="detailMode"><!-- confirm（仮登録の確定） or update（確定済みの編集） -->
      <div class="form-group">
        <label>表示名</label>
        <input type="text" id="detailDisplayName" required>
      </div>
      <div class="form-group">
        <label>書類種別</label>
        <select id="detailUseTypeId"><option value="">未設定</option></select>
      </div>
      <div class="form-group">
        <label>タグ</label>
        <div id="detailTagCheckboxes" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      </div>
      <div class="form-group">
        <label>紐付け先（案件・複数可）</label>
        <div id="detailProjectPicker"></div>
      </div>
      <div style="display:flex; gap:12px;">
        <div class="form-group" style="flex:1;">
          <label>取引先</label>
          <input type="text" id="detailClient" placeholder="例：〇〇株式会社">
        </div>
        <div class="form-group" style="flex:1;">
          <label>発行／受領</label>
          <select id="detailIssuedOrReceived">
            <option value="">未設定</option>
            <option value="発行">発行</option>
            <option value="受領">受領</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>適格事業者登録番号</label>
        <input type="text" id="detailInvoiceRegistrationNumber" placeholder="例：T1234567890123（Tから始まる13桁）">
      </div>
      <div style="display:flex; gap:12px;">
        <div class="form-group" style="flex:1;">
          <label>税率</label>
          <select id="detailTaxRate"></select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>金額（税抜）</label>
          <input type="number" id="detailAmountExcl" min="0" step="1" placeholder="例：50000">
        </div>
        <div class="form-group" style="flex:1;">
          <label>金額（税込）</label>
          <input type="number" id="detailAmountIncl" min="0" step="1" placeholder="例：55000">
        </div>
      </div>
      <div class="form-group">
        <label>取引日</label>
        <input type="date" id="detailTransactionDate">
      </div>
      <div class="form-group">
        <label>説明・備考</label>
        <textarea id="detailDescription" rows="3"></textarea>
      </div>
      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:20px;">
        <button type="button" id="detailDeleteBtn" class="btn btn-danger-soft" onclick="handleDeleteFromDetail()">
          <span class="material-symbols-outlined">delete</span> ゴミ箱へ移動
        </button>
        <button type="submit" id="detailSubmitBtn" class="btn btn-success">確定保存</button>
      </div>
    </form>
    </div>
  </div>
</div>

<!-- マスタ管理モーダル（S08・S10統合：タグ／用途種別） -->
<div id="tagModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="padding:0;">
    <div class="modal-header">
      <button type="button" class="modal-close-btn" onclick="closeTagModal()" aria-label="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 class="modal-title">マスタ管理</h2>
    </div>
    <div class="modal-body">
      <h3 style="font-size:15px; color:#334155;">タグ</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="newTagNameInput" placeholder="新規タグ名を入力">
        <button class="btn btn-primary" onclick="handleAddTag()">追加</button>
      </div>
      <div id="tagListArea"></div>

      <h3 style="font-size:15px; color:#334155; margin-top:24px;">書類種別（見積書・請求書など）</h3>
      <div id="useTypeAddArea"><!-- 追加・削除は管理者のみ（権限が無い場合は、JSで非表示にする） -->
        <div style="display:flex; gap:8px; margin-bottom:6px;">
          <input type="text" id="newUseTypeNameInput" placeholder="書類種別名（例：見積書）" style="flex:1;">
        </div>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input type="text" id="newUseTypeKeywordsInput" placeholder="自動判定用キーワード（カンマ区切り・任意）" style="flex:1;">
          <button class="btn btn-primary" onclick="handleAddUseType()">追加</button>
        </div>
      </div>
      <div id="useTypeListArea"></div>

      <div style="display:flex; justify-content:flex-end; margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeTagModal()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- ゴミ箱画面（S07） -->
<div id="trashModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="padding:0;">
    <div class="modal-header">
      <button type="button" class="modal-close-btn" onclick="closeTrashModal()" aria-label="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 class="modal-title">ゴミ箱（30日以内は復元できます）</h2>
    </div>
    <div class="modal-body">
      <div id="trashListArea"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeTrashModal()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- 削除済みファイル管理画面（S12・管理者専用） -->
<div id="deletedFilesModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="padding:0;">
    <div class="modal-header">
      <button type="button" class="modal-close-btn" onclick="closeDeletedFilesModal()" aria-label="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 class="modal-title" style="--modal-accent: #dc2626;">削除済みファイル管理（管理者専用）</h2>
    </div>
    <div class="modal-body">

      <div style="display:flex; justify-content:flex-end; margin-top:20px;">
